defaults:
  - dataset: pokemon_11k
  - encoder: vit_tiny
  - _self_

num_epochs: 200
batch_size: 128
learning_rate: 3e-4
weight_decay: 0.05
warmup_epochs: 10
beta1: 0.9
beta2: 0.95
ema_decays: [0.9999]
amp_dtype: bfloat16
seed: 1999
checkpoint_dir: checkpoints
log_every: 10
sample_every: 50
validate_every: 10

# Multi-crop
n_global_crops: 2
n_local_crops: 4
global_crop_size: 96
local_crop_size: 32
global_crop_scale_min: 0.3
global_crop_scale_max: 1.0
local_crop_scale_min: 0.05
local_crop_scale_max: 0.3

# Color augmentation: default | colorjitter | lab
# "default" = original ColorJitter(0.4,0.4,0.2,0.1). The morphology experiments
# use "colorjitter"/"lab" to randomize absolute palette while preserving relative
# color geometry. See conf/train_lejepa_morph_*.yaml.
color_aug: default
cj_brightness: 0.4
cj_contrast: 0.4
cj_saturation: 0.4
cj_hue: 0.125          # 0.5 == 180deg; 0.125 ~= +/-45deg
lab_hue_deg: 45.0      # Lab chroma-plane rotation range (degrees)
lab_lightness: 0.1     # Lab L shift fraction
lab_chroma: 0.3        # Lab chroma scale jitter

# Projection head (SSL-only; discarded for downstream/fusion)
proj_hidden_dim: 2048
proj_output_dim: 128
# SIGReg
sigreg_n_slices: 256
sigreg_t_max: 3.0
sigreg_n_quad: 17
# Single leJEPA hyperparameter: total = lambda*SIGReg + (1-lambda)*invariance
sigreg_lambda: 0.02
